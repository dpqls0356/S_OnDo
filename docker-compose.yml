version: "3.8"

services:

  nginx:
    image: nginx
    container_name: nginx
    volumes:
      - /home/ubuntu/nginx/conf.d/:/etc/nginx/conf.d
      - /home/ubuntu/etc/ssl:/etc/ssl

    ports:
      - 80:80
      - 443:443
    networks:
      - ci
      - ondo
    depends_on:
      - backend
      - frontend

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /jenkins:/var/jenkins_home
    ports:
      - "8080:8080"
    privileged: true
    user: root
    networks:
      - ci

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ondo
    restart: always

  redis:
    container_name: redis
    image: redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - ondo
    volumes:
      - redis-data:/data
    restart: always

  mongo:
    container_name: mongo
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD}"
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always
    networks:
      - ondo

  backend:
    build:
      context: ./backend/ondo
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=oauth,secret
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - mysql
      - redis
      - mongo
    networks:
      - ondo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - ondo

volumes:
  mysql-data:
  redis-data:
  mongo-data:

networks:
  ondo:
  ci:
    external: true
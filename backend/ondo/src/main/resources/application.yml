spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ondo?serverTimezone=UTC
    username: clio
    password: clio
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  data:
    mongodb:
      host: localhost
      port: 27017
      database: ondo

    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true

  jwt:
    secret: jwtsecrettoken
    # 30분 1800000
    access-token-expiration: 1800000
    # 2주일 1209600000
    refresh-token-expiration: 1209600000

  profiles:
    active: local
    include: oauth

  batch:
    job:
      enabled: false
  config:
    import: "classpath:s3.properties"

logging:
  level:
    org:
      springframework:
        security:
          DEBUG


cloud:
  aws:
    region:
      static: us-east-2  # 지역 코드 (한국 서울)
    stack:
      auto: false  # CloudFormation 자동 구성을 비활성화
    s3:
      bucket: ${bucket.name}
    credentials:
      accessKey: ${access.key}
      secretKey: ${secret.key}

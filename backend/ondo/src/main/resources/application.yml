spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ondo?serverTimezone=Asia/Seoul
    username: clio
    password: clio
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    mongodb:
      host: localhost
      port: 27017
      database: ondo
      username: clio
      password: clio

    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true

  jwt:
    secret: jwtsecrettoken
    # 30분
    access-token-expiration: 1800000
    # 2주일
    refresh-token-expiration: 1209600000

logging:
  level:
    org.hibernate.sql: debug
    # org.hibernate.type: trace
spring:
  datasource:
    url: jdbc:mysql://localhost/ondo?serverTimezone=Asia/Seoul
    username: clio
    password: clio
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  data:
    mongodb:
      host: mongo
      port: 27017
      database: ondo

    redis:
      host: redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  jwt:
    secret: jwtsecrettoken
    access-token-expiration: 1800000
    refresh-token-expiration: 1209600000

  profiles:
    active: prod
    include: oauth

  batch:
    job:
      enabled: false


openvidu:
  url: "http://localhost:4443/"
  secret: "ondo_project_openvidu"
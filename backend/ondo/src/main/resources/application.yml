spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    mongodb:
      host: mongo
      port: 27017
      database: ondo # MongoDB 데이터베이스 이름
      username: ${MONGO_INITDB_ROOT_USERNAME}
      password: ${MONGO_INITDB_ROOT_PASSWORD}

    redis:
      host: redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jwt:
    secret: jwtsecrettoken
    access-token-expiration: 1800000  # 30분
    refresh-token-expiration: 1209600000  # 2주일

  profiles:
    active: oauth  # Docker에서 정의된 프로파일

  batch:
    job:
      enabled: false

  config:
    import:
      - "classpath:s3.properties"
      - "classpath:openaiapi.properties"
      - "classpath:perspectiveapi.properties"

logging:
  level:
    org:
      springframework:
        security:
          DEBUG

cloud:
  aws:
    region:
      static: us-east-2
    stack:
      auto: false
    s3:
      bucket: ${bucket.name}
    credentials:
      accessKey: ${access.key}
      secretKey: ${secret.key}

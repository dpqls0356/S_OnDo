spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ondo?serverTimezone=Asia/Seoul
    username: clio
    password: clio
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    mongodb:
      host: localhost
      port: 27017
      database: ondo

    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  jwt:
    secret: jwtsecrettoken
    # 30분
    access-token-expiration: 1800000
    # 2주일
    refresh-token-expiration: 1209600000

logging:
  level:
    org.hibernate.sql: debug
    org:
      springframework:
        data:
          mongodb:
            core:
              MongoTemplate: DEBUG
    # org.hibernate.type: trace

server:
  port: 5000
  ssl:
    enabled: false

openvidu:
  url: ${OPENVIDU_URL}
  secret: ${OPENVIDU_SECRET}

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/ondo?serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  data:
    mongodb:
      host: mongo
      port: 27017
      database: ${MONGO_DATABASE}
      username: ${MONGO_INITDB_ROOT_USERNAME}
      password: ${MONGO_INITDB_ROOT_PASSWORD}

    redis:
      host: redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  jwt:
    secret: ${JWT_TOKEN_SECRET}
    # 30분 1800000
    access-token-expiration: 1800000
    # 2주일 1209600000
    refresh-token-expiration: 1209600000

  profiles:
    include: oauth

  batch:
    job:
      enabled: false

  config:
    import: "classpath:s3.properties"

cloud:
  aws:
    region:
      static: us-east-2  # 지역 코드 (한국 서울)
    stack:
      auto: false  # CloudFormation 자동 구성을 비활성화
    s3:
      bucket: ${bucket.name}
    credentials:
      accessKey: ${access.key}
      secretKey: ${secret.key}
